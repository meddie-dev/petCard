<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · PetCard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-logo">
        <i class="fa-solid fa-shield-dog"></i>
        <h1>PetCard</h1>
        <p>FurParent Suite</p>
      </div>

      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin">Sign In</button>
          <button class="auth-tab" id="tabRegister">Register</button>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" id="loginEmail" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" id="loginPassword" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <form id="registerForm" class="hidden">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="form-control" id="regName" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" id="regEmail" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" id="regPassword" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>
      </div>

      <p class="auth-footer">
        <a href="admin-login.html">Admin Login</a> · <a href="index.html">Back to Home</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="main.js"></script>
</body>
</html>
