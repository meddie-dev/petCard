<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Pet · PetCard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <button id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
    <h1>Add Pet</h1>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i class="fa-solid fa-shield-dog"></i>
      <div><h1>PetCard</h1><p>FurParent Suite</p></div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="add-pet.html" class="active"><i class="fa-solid fa-plus"></i> Add Pet</a>
      <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
      <a href="furparent-card.html"><i class="fa-solid fa-address-card"></i> FurParent Card</a>
      <div class="nav-divider">Account</div>
      <a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebarUserAvatar"><i class="fa-solid fa-user"></i></div>
        <div class="user-info">
          <strong id="sidebarUserName">FurParent</strong>
          <span id="sidebarUserId">—</span>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <h1>Add New Pet</h1>
      <p>Register a new pet under your account.</p>
    </div>

    <div class="card" style="max-width:820px;">
      <form id="addPetForm">
        <div class="form-row">
          <div class="form-group">
            <label>Pet Name</label>
            <input type="text" class="form-control" id="petName" required>
          </div>
          <div class="form-group">
            <label>Species</label>
            <select class="form-control" id="petSpecies" required>
              <option>Dog</option><option>Cat</option><option>Bird</option>
              <option>Rabbit</option><option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Breed</label>
            <input type="text" class="form-control" id="petBreed">
          </div>
          <div class="form-group">
            <label>Age (years)</label>
            <input type="number" class="form-control" id="petAge" min="0" max="40">
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select class="form-control" id="petGender">
              <option>Male</option><option>Female</option>
            </select>
          </div>
          <div class="form-group">
            <label>Color</label>
            <input type="text" class="form-control" id="petColor">
          </div>
        </div>

        <div class="form-group">
          <label>Notes</label>
          <textarea class="form-control" id="petNotes" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label>Pet Photo (optional)</label>
          <input type="file" class="form-control" id="petPhoto" accept="image/*">
        </div>

        <div class="card" style="background:#f8fafc;margin:20px 0;">
          <div class="card-title mb-8"><i class="fa-solid fa-microchip"></i> Universal Pet ID (Preview)</div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong id="previewPetId" style="font-family:monospace;font-size:1.05rem;color:var(--navy);">—</strong>
            <i class="fa-solid fa-qrcode" style="font-size:1.3rem;color:var(--navy);"></i>
          </div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Pet</button>
          <a href="dashboard.html" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="main.js"></script>
</body>
</html>
