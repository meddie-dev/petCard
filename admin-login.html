<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · PetCard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-logo">
        <i class="fa-solid fa-shield-halved"></i>
        <h1>Admin Portal</h1>
        <p>PetCard Management Console</p>
      </div>

      <div class="auth-card">
        <form id="loginForm">
          <div class="form-group">
            <label>Admin Email</label>
            <input type="email" class="form-control" id="loginEmail" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" id="loginPassword" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign In as Admin</button>
        </form>
      </div>

      <p class="auth-footer"><a href="login.html">FurParent Login</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    // Admin-specific login — redirects to admin-dashboard on success
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      try {
        await Auth.signIn(email, password);
        const profile = await Auth.getCurrentProfile();
        if (!profile || profile.role !== 'admin') {
          await Auth.signOut();
          throw new Error('Not an admin account');
        }
        location.href = 'admin-dashboard.html';
      } catch (err) {
        alert(err.message || 'Login failed');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
